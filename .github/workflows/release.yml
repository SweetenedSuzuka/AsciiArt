name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 1.0.0
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false # 项目没有模块依赖，不需要缓存。

      - name: 确定版本号
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "$INPUT_VERSION" in
            "") ;;
            *[!0-9A-Za-z._+-]*)
              echo "版本号只允许字母、数字、点、加号、下划线和连字符，当前输入参数为：$INPUT_VERSION" >&2
              exit 1
              ;;
          esac
          if [ -n "$INPUT_VERSION" ]; then
            printf 'value=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            printf 'value=%s\n' "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            printf 'value=0.0.0-dev.%s\n' "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 格式检查
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt："
            echo "$out"
            exit 1
          fi

      - name: 静态检查
        shell: bash
        # 关闭 unsafeptr 检查：Win32 绑定中消息参数以 uintptr 类型传入，需要重新解释为指针，静态分析器无法区分这种情况与指针运算错误。
        run: go vet -unsafeptr=false ./...

      - name: 测试
        shell: bash
        run: go test ./...

      - name: 构建与打包
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build.sh --package --skip-tests

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: asciiart-${{ steps.version.outputs.value }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "AsciiArt ${GITHUB_REF#refs/tags/v}" \
            --notes "发布说明见 README。" \
            dist/*.zip dist/SHA256SUMS.txt
